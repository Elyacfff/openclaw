<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="超级手机网站 - 20+模式，1000+功能，玻璃拟态设计">
  <title>✨ 超级手机网站</title>
  
  <style>
    /* ==================== 高级玻璃拟态设计系统 ==================== */
    :root {
      /* 渐变背景 */
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      --gradient-hero: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      --gradient-cards: linear-gradient(145deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.1) 100%);
      --gradient-glass: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.1) 100%);
      
      /* 玻璃效果 */
      --glass-bg: rgba(255, 255, 255, 0.2);
      --glass-bg-strong: rgba(255, 255, 255, 0.3);
      --glass-bg-light: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-border-light: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      --glass-shadow-strong: 0 16px 48px rgba(0, 0, 0, 0.2);
      --glass-blur: blur(20px);
      --glass-blur-strong: blur(30px);
      
      /* 颜色系统 */
      --primary: #667eea;
      --primary-light: #8b9ff8;
      --primary-dark: #4c5bd9;
      --secondary: #764ba2;
      --accent: #f093fb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      
      /* 文字颜色 */
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.85);
      --text-tertiary: rgba(255, 255, 255, 0.6);
      --text-dark: #1f2937;
      --text-dark-secondary: #4b5563;
      
      /* 圆角系统 */
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --radius-2xl: 32px;
      --radius-full: 9999px;
      
      /* 间距 */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 20px;
      --space-2xl: 24px;
      --space-3xl: 32px;
      
      /* 动画 */
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      
      /* 字体 */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 基础重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font-family);
      color: var(--text-primary);
      background: var(--gradient-hero);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      touch-action: manipulation;
      position: relative;
    }

    /* 动态背景 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ==================== 玻璃组件 ==================== */
    
    /* 玻璃卡片 - 基础 */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--glass-shadow);
      transition: all var(--transition-normal);
    }

    /* 玻璃卡片 - 悬浮 */
    .glass:hover {
      background: var(--glass-bg-strong);
      transform: translateY(-4px);
      box-shadow: var(--glass-shadow-strong);
    }

    /* 玻璃卡片 - 深色 */
    .glass-dark {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* 玻璃按钮 */
    .btn-glass {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-normal);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .btn-glass::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .btn-glass:hover::before {
      left: 100%;
    }

    .btn-glass:hover {
      background: var(--glass-bg-strong);
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .btn-glass:active {
      transform: scale(0.98);
    }

    /* 主按钮 */
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border-color: var(--primary-light);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.6);
    }

    /* 次要按钮 */
    .btn-secondary {
      background: var(--glass-bg-light);
      border-color: var(--glass-border-light);
    }

    /* 图标按钮 */
    .btn-icon {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: var(--radius-full);
      font-size: 22px;
    }

    /* 玻璃输入框 */
    .input-glass {
      width: 100%;
      padding: var(--space-md) var(--space-xl);
      background: var(--glass-bg-light);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition: all var(--transition-normal);
    }

    .input-glass::placeholder {
      color: var(--text-tertiary);
    }

    .input-glass:focus {
      border-color: var(--primary-light);
      background: var(--glass-bg);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
    }

    /* ==================== 应用容器 ==================== */
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* ==================== 页面样式 ==================== */
    .page {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      transform: translateX(0);
      transition: all var(--transition-normal);
    }

    .page.active {
      display: flex;
      opacity: 1;
    }

    .page.slide-left {
      transform: translateX(-100%);
    }

    .page.slide-right {
      transform: translateX(100%);
    }

    /* ==================== 头部 ==================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: var(--space-xl);
      padding-top: max(var(--space-xl), env(safe-area-inset-top));
      background: rgba(102, 126, 234, 0.4);
      backdrop-filter: var(--glass-blur-strong);
      -webkit-backdrop-filter: var(--glass-blur-strong);
      border-bottom: 1px solid var(--glass-border);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .header-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: var(--space-xs);
    }

    .header-actions {
      display: flex;
      gap: var(--space-md);
    }

    /* ==================== 滚动内容 ==================== */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .main-content {
      padding: var(--space-xl);
      padding-bottom: 100px;
    }

    /* ==================== 英雄区域 ==================== */
    .hero {
      padding: var(--space-2xl);
      margin-bottom: var(--space-xl);
      background: var(--gradient-glass);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border-light);
      border-radius: var(--radius-2xl);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      animation: pulse-bg 4s ease-in-out infinite;
    }

    @keyframes pulse-bg {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .hero-icon {
      font-size: 64px;
      margin-bottom: var(--space-lg);
      position: relative;
      z-index: 1;
    }

    .hero-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: var(--space-sm);
      position: relative;
      z-index: 1;
    }

    .hero-desc {
      font-size: 15px;
      color: var(--text-secondary);
      position: relative;
      z-index: 1;
    }

    /* ==================== 统计卡片 ==================== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-lg);
      margin-bottom: var(--space-xl);
    }

    .stat-card {
      padding: var(--space-xl);
      background: var(--gradient-cards);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      text-align: center;
      transition: all var(--transition-normal);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--glass-shadow-strong);
    }

    .stat-icon {
      font-size: 32px;
      margin-bottom: var(--space-sm);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: var(--space-xs);
      background: linear-gradient(135deg, #fff 0%, #f0f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ==================== 工具栏 ==================== */
    .toolbar {
      display: flex;
      gap: var(--space-md);
      padding: var(--space-md) 0;
      margin-bottom: var(--space-xl);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .toolbar::-webkit-scrollbar {
      display: none;
    }

    .toolbar-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl);
      background: var(--glass-bg-light);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all var(--transition-normal);
      flex-shrink: 0;
    }

    .toolbar-item:hover {
      background: var(--glass-bg);
      transform: scale(1.05);
    }

    .toolbar-item.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border-color: var(--primary-light);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    /* ==================== 模式网格 ==================== */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-lg);
      margin-bottom: var(--space-2xl);
    }

    .mode-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-xl);
      background: var(--gradient-cards);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      cursor: pointer;
      transition: all var(--transition-normal);
      position: relative;
      overflow: hidden;
    }

    .mode-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
      opacity: 0;
      transition: opacity var(--transition-normal);
    }

    .mode-card:hover::before {
      opacity: 1;
    }

    .mode-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: var(--glass-shadow-strong);
      border-color: var(--glass-border-light);
    }

    .mode-card:active {
      transform: scale(0.95);
    }

    .mode-icon {
      font-size: 40px;
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    .mode-name {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .mode-count {
      font-size: 11px;
      color: var(--text-secondary);
      position: relative;
      z-index: 1;
    }

    /* ==================== 功能列表 ==================== */
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      padding: var(--space-lg);
      background: var(--gradient-cards);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .feature-item:hover {
      background: var(--glass-bg-strong);
      transform: translateX(8px);
      box-shadow: var(--glass-shadow);
    }

    .feature-item:active {
      transform: scale(0.98);
    }

    .feature-icon {
      font-size: 28px;
      flex-shrink: 0;
    }

    .feature-content {
      flex: 1;
      min-width: 0;
    }

    .feature-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: var(--space-xs);
      color: var(--text-primary);
    }

    .feature-desc {
      font-size: 13px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .feature-arrow {
      font-size: 20px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    /* ==================== 底部导航 ==================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-around;
      padding: var(--space-sm) var(--space-lg);
      padding-bottom: max(var(--space-sm), env(safe-area-inset-bottom));
      background: rgba(102, 126, 234, 0.5);
      backdrop-filter: var(--glass-blur-strong);
      -webkit-backdrop-filter: var(--glass-blur-strong);
      border-top: 1px solid var(--glass-border);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-normal);
      border-radius: var(--radius-lg);
      min-width: 60px;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-primary);
      background: var(--glass-bg-light);
    }

    .nav-item.active {
      color: var(--primary-light);
      font-weight: 600;
    }

    .nav-icon {
      font-size: 24px;
      line-height: 1;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 500;
    }

    /* ==================== 功能详情页面 ==================== */
    .feature-page {
      padding: var(--space-xl);
    }

    .feature-hero {
      text-align: center;
      margin-bottom: var(--space-2xl);
    }

    .feature-hero-icon {
      font-size: 80px;
      margin-bottom: var(--space-lg);
    }

    .feature-hero-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: var(--space-sm);
    }

    .feature-hero-desc {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* ==================== 计算器 ==================== */
    .calculator {
      background: var(--gradient-cards);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-2xl);
      padding: var(--space-xl);
      margin-bottom: var(--space-xl);
    }

    .calc-display {
      width: 100%;
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-size: 32px;
      font-weight: 600;
      text-align: right;
      outline: none;
    }

    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
    }

    .calc-btn {
      padding: var(--space-lg);
      background: var(--glass-bg-light);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calc-btn:hover {
      background: var(--glass-bg);
      transform: scale(1.05);
    }

    .calc-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.3);
    }

    .calc-btn.operator {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.4) 0%, rgba(118, 75, 162, 0.4) 100%);
      border-color: var(--primary);
    }

    .calc-btn.operator:hover {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.6) 0%, rgba(118, 75, 162, 0.6) 100%);
    }

    .calc-btn.equals {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border-color: var(--primary-light);
    }

    /* ==================== 天气卡片 ==================== */
    .weather-card {
      background: var(--gradient-cards);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-2xl);
      padding: var(--space-2xl);
      text-align: center;
      margin-bottom: var(--space-xl);
      position: relative;
      overflow: hidden;
    }

    .weather-icon {
      font-size: 96px;
      margin-bottom: var(--space-lg);
    }

    .weather-temp {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: var(--space-sm);
    }

    .weather-desc {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: var(--space-xl);
    }

    .weather-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-lg);
    }

    .weather-detail {
      padding: var(--space-lg);
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius-lg);
    }

    .weather-detail-icon {
      font-size: 24px;
      margin-bottom: var(--space-sm);
    }

    .weather-detail-label {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: var(--space-xs);
    }

    .weather-detail-value {
      font-size: 16px;
      font-weight: 600;
    }

    /* ==================== 日历 ==================== */
    .calendar {
      background: var(--gradient-cards);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-2xl);
      padding: var(--space-xl);
      margin-bottom: var(--space-xl);
    }

    .calendar-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .calendar-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: var(--space-xs);
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }

    .calendar-weekday {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      padding: var(--space-sm);
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--space-sm);
    }

    .calendar-day {

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

      animation: fadeIn var(--transition-normal) ease;
    }

    .animate-slide-up {

    .animate-slide-down {

    // 渲染模式网格
    function renderModeGrid() {
      const grid = document.getElementById('mode-grid');
      if (!grid) return;

      grid.innerHTML = MODES.map(mode => `
        <div class="mode-card animate-scale-in" onclick="openMode('${mode.id}')">
          <div class="mode-icon">${mode.icon}</div>
          <div class="mode-name">${mode.name}</div>
          <div class="mode-count">${mode.features.length}+功能</div>
        </div>
      `).join('');
    }

    // 打开模式
    function openMode(modeId) {
      currentMode = MODES.find(m => m.id === modeId);
      if (!currentMode) return;

      previousPage = 'home';

      const title = document.getElementById('mode-header-title');
      const subtitle = document.getElementById('mode-header-subtitle');
      const featureList = document.getElementById('feature-list');

      if (title) title.innerHTML = `<span>${currentMode.icon}</span><span>${currentMode.name}</span>`;
      if (subtitle) subtitle.textContent = `${currentMode.features.length}个功能可用`;

      if (featureList) {
        featureList.innerHTML = currentMode.features.map((feature, index) => `
          <div class="feature-item animate-slide-up" style="animation-delay: ${index * 0.05}s" onclick="openFeature('${feature.id}')">
            <div class="feature-icon">${feature.icon}</div>
            <div class="feature-content">
              <div class="feature-title">${feature.name}</div>
              <div class="feature-desc">${feature.description}</div>
            </div>
            <div class="feature-arrow">›</div>
          </div>
        `).join('');
      }

      showPage('mode');
    }

    // 生成日历
    function generateCalendarDays() {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayDate = today.getDate();

      let html = '';
      
      // 上个月的天数
      const prevMonthDays = new Date(year, month, 0).getDate();
      for (let i = firstDay - 1; i >= 0; i--) {
        html += `<button class="calendar-day other-month">${prevMonthDays - i}</button>`;
      }
      
      // 当前月的天数
      for (let i = 1; i <= daysInMonth; i++) {
        const isToday = i === todayDate;
        html += `<button class="calendar-day ${isToday ? 'today' : ''}">${i}</button>`;
      }
      
      // 下个月的天数
      const remainingDays = 42 - (firstDay + daysInMonth);
      for (let i = 1; i <= remainingDays; i++) {
        html += `<button class="calendar-day other-month">${i}</button>`;
      }
      
      return html;
    }

    // ==================== 功能逻辑 ====================
    let calcValue = '0';
    let calcOperator = '';
    let calcPrevious = '';
    let calcNewNumber = true;

    function calcInput(value) {
      const display = document.getElementById('calc-display');
      if (!display) return;

      if (value === 'C') {
        calcValue = '0';
        calcOperator = '';
        calcPrevious = '';
        calcNewNumber = true;
      } else if (value === '±') {
        calcValue = String(-parseFloat(calcValue));
      } else if (value === '%') {
        calcValue = String(parseFloat(calcValue) / 100);
      } else if (['+', '−', '×', '÷'].includes(value)) {
        if (calcOperator && !calcNewNumber) {
          calcResult();
        }
        calcPrevious = calcValue;
        calcOperator = value;
        calcNewNumber = true;
      } else if (value === '=') {
        calcResult();
        calcOperator = '';
        calcPrevious = '';
      } else {
        if (calcNewNumber) {
          calcValue = value;
          calcNewNumber = false;
        } else {
          calcValue += value;
        }
      }

      display.value = calcValue;
    }

    function calcResult() {
      if (!calcOperator || !calcPrevious) return;
      
      const prev = parseFloat(calcPrevious);
      const curr = parseFloat(calcValue);
      let result;

      switch (calcOperator) {
        case '+': result = prev + curr; break;
        case '−': result = prev - curr; break;
        case '×': result = prev * curr; break;
        case '÷': result = curr !== 0 ? prev / curr : 'Error'; break;
        default: return;
      }

      calcValue = String(result);
      calcNewNumber = true;
    }

    }

    function generateTodoList() {
      const todos = getTodos();
      if (todos.length === 0) {
        return '<div class="glass" style="padding: var(--space-2xl); text-align: center; color: var(--text-secondary);">还没有任务，添加一个吧 ✨</div>';
      }
      
      return todos.map((todo, index) => `
        <div class="todo-item ${todo.completed ? 'completed' : ''}">
          <div class="todo-checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodo(${index})">
            ${todo.completed ? '✓' : ''}
          </div>
          <div class="todo-text">${todo.text}</div>
          <div class="todo-delete" onclick="deleteTodo(${index})">🗑️</div>
        </div>
      `).join('');
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      if (!input || !input.value.trim()) return;

      const todos = getTodos();
      todos.push({ text: input.value.trim(), completed: false });
      saveTodos(todos);

      input.value = '';
      document.getElementById('todo-list').innerHTML = generateTodoList();
    }

    function handleTodoKeypress(event) {
      if (event.key === 'Enter') addTodo();
    }

    function toggleTodo(index) {
      const todos = getTodos();
      todos[index].completed = !todos[index].completed;
      saveTodos(todos);
      document.getElementById('todo-list').innerHTML = generateTodoList();
    }

    function deleteTodo(index) {
      const todos = getTodos();
      todos.splice(index, 1);
      saveTodos(todos);
      document.getElementById('todo-list').innerHTML = generateTodoList();
    }

    // 笔记
    function saveNote() {
      const textarea = document.getElementById('note-textarea');
      if (!textarea) return;
      localStorage.setItem('note-content', textarea.value);
      alert('💾 笔记已保存！');
    }

    function clearNote() {
      const textarea = document.getElementById('note-textarea');
      if (!textarea) return;
      if (confirm('确定要清空笔记吗？')) {
        textarea.value = '';
        localStorage.removeItem('note-content');
      }
    }

    // 音乐控制
    let isPlaying = false;
    function musicToggle() {
      isPlaying = !isPlaying;
      const btn = document.querySelector('.music-btn.play');
      if (btn) btn.textContent = isPlaying ? '⏸️' : '▶️';
    }
    function musicPrev() { console.log('上一首'); }
    function musicNext() { console.log('下一首'); }

    // ==================== 页面导航 ====================
    function showPage(pageName) {
      const pages = document.querySelectorAll('.page');
      const navItems = document.querySelectorAll('.nav-item');

      pages.forEach(page => {
        page.classList.remove('active', 'slide-left', 'slide-right');
        if (page.id === `page-${pageName}`) {
          page.classList.add('active', 'animate-fade-in');
        }
      });

      navItems.forEach(item => {
        item.classList.remove('active');
        if (item.getAttribute('data-page') === pageName) {
          item.classList.add('active');
        }
      });

      currentPage = pageName;

      // 更新工具栏高亮
      updateToolbar();
    }

    function updateToolbar() {
      const toolbar = document.getElementById('toolbar');
      if (!toolbar) return;
      
      const items = toolbar.querySelectorAll('.toolbar-item');
      items.forEach(item => {
        item.classList.remove('active');
        if (item.getAttribute('data-mode') === currentMode?.id) {
          item.classList.add('active');
        }
      });
    }

    function switchMode(modeId) {
      const mode = MODES.find(m => m.id === modeId);
      if (mode) openMode(modeId);
    }

    // ==================== 其他功能 ====================
    function toggleTheme() {
      alert('🌙 主题切换功能开发中...');
    }

    function showSearch() {
      alert('🔍 搜索功能开发中...');
    }

    function initFeatureFunctionality(featureId) {
      // 根据功能ID初始化特定功能
    }

    function loadData() {
      // 加载本地数据
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
